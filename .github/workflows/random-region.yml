name: random-region

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 从上游同步 random-region 数据
        run: |
          git remote add upstream https://github.com/wanwushequ/cfyxip.git || true
          git fetch --depth=1 upstream main
          rm -rf random-region
          git checkout upstream/main -- random-region
          echo "同步完成，文件数: $(find random-region -type f | wc -l)"

      - name: 检查文件是否有变动并提交推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add random-region/

          if git diff --cached --quiet; then
            echo "没有发现任何内容变动，跳过提交。"
          else
            echo "发现内容更新，准备推送库。"
            git commit -m "random-region $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD
          fi
